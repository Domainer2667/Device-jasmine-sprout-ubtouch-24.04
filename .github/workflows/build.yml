name: Build Ubuntu Touch (Mi A2)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:
    inputs:
      ut_release:
        description: 'Ubuntu Touch Release'
        required: true
        default: '24.04-2.x'
        type: choice
        options:
          - '24.04-2.x'
          - '24.04-1.x'
          - 'focal'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ca-certificates cpio curl \
            fakeroot flex git kmod libelf-dev libssl-dev libtinfo5 lz4 \
            python2 python3 sudo unzip wget xz-utils pahole libbpf-dev \
            clang llvm lld img2simg jq zstd
          sudo ln -sf python2 /usr/bin/python

      - name: Clone generic adaptation build tools
        run: |
          git clone -b main https://gitlab.com/ubports/porting/community-ports/halium-generic-adaptation-build-tools.git build

      - name: Set Ubuntu Touch Release
        run: |
          if [ "${{ github.event.inputs.ut_release }}" != "" ]; then
            sed -i 's/deviceinfo_ubuntu_touch_release=.*/deviceinfo_ubuntu_touch_release="${{ github.event.inputs.ut_release }}"/' deviceinfo
          fi
          cat deviceinfo

      - name: Build Device Adaptation (Kernel + Tarball)
        run: |
          ./build/build.sh

      - name: Generate Flashable Images
        run: |
          DEVICE="$(source deviceinfo && echo $deviceinfo_codename)"
          ./build/prepare-fake-ota.sh out/device_${DEVICE}.tar.xz ota
          mkdir -p out
          ./build/system-image-from-ota.sh ota/ubuntu_command out
          if [ -f out/rootfs.img ]; then
            mv out/rootfs.img out/ubuntu.img
          fi

      - name: Upload Flashable Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-touch-mi-a2-images
          path: |
            out/*boot.img
            out/system.img
            out/ubuntu.img
            out/device_*.tar.xz
            out/*.zst
